---
# Required status check. Establishes, before a pull request can merge, that a
# changelog entry exists, that exactly one authoring route was used, and that
# nobody hand-edited CHANGELOG.md.
#
# Deliberately NOT draft-gated. A required check that skips reports success
# without having evaluated anything, which is indistinguishable from passing —
# the reference implementations have this bug today. Drafts are cheap to check;
# the cost of a gate that lies is not.
#
# On merge_group it re-evaluates rather than auto-passing, for the same reason.
name: changelog-check

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize, labeled, unlabeled]
  merge_group:

permissions: {}

jobs:
  changelog-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: "Resolve the pull request"
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "${RUNNER_DEBUG}" == 1 ] && set -xv
          set -euo pipefail

          # A queued entry names its pull requests in the merge-group head ref:
          #   gh-readonly-queue/main/pr-7-<sha>
          if [ "${GITHUB_EVENT_NAME}" == "merge_group" ]; then
            number="$(sed -E 's|.*/pr-([0-9]+)-[0-9a-f]+$|\1|' <<<"${GITHUB_REF_NAME}")"
          else
            number="${{ github.event.pull_request.number }}"
          fi

          if ! [[ "${number}" =~ ^[0-9]+$ ]]; then
            echo "::error::could not determine a pull-request number from ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "::notice::checking pull request #${number}"
          echo "number=${number}" >>"${GITHUB_OUTPUT}"

      - name: "CHANGELOG.md is written by assembly, not by hand"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          [ "${RUNNER_DEBUG}" == 1 ] && set -xv
          set -euo pipefail

          if ! gh pr diff "${PR}" --name-only | grep -qx "CHANGELOG.md"; then
            exit 0
          fi

          # The escape hatch exists for correcting history, not for routine use.
          if gh pr view "${PR}" --json labels --jq '.labels[].name' | grep -qx "manual-changelog"; then
            echo "::warning::CHANGELOG.md edited under the manual-changelog label"
            exit 0
          fi

          echo "::error::this pull request edits CHANGELOG.md; the entry belongs in the pull-request body or in .changelog/"
          exit 1

      - name: "Exactly one changelog entry, and it is valid"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          [ "${RUNNER_DEBUG}" == 1 ] && set -xv
          set -euo pipefail

          entry="$(.github/scripts/changelog-entry.sh "${PR}")"

          # Compose the entry into a candidate release block and hand it to the
          # same validator that guards CHANGELOG.md, so a malformed category or
          # heading is refused here rather than after merge, when the only
          # remedy is a follow-up commit on main.
          work="$(mktemp -d)"
          {
            echo "# changelog"
            echo
            echo "## [9999.0.0] - 2999-01-01"
            echo
            printf '%s\n' "${entry}"
          } >"${work}/CHANGELOG.md"

          if ! docker run --rm \
              --volume "${work}/CHANGELOG.md:/home/CHANGELOG.md:ro" \
              --volume "${PWD}/.github/clq/changemap.json:/home/changemap.json:ro" \
              denisa/clq:1.8.28 -changeMap /home/changemap.json -release /home/CHANGELOG.md; then
            echo "::error::the changelog entry is not valid; it must use the categories in .github/clq/changemap.json"
            {
              echo "## Rejected entry"
              echo '```markdown'
              printf '%s\n' "${entry}"
              echo '```'
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          {
            echo "## Changelog entry"
            printf '%s\n' "${entry}"
          } >>"${GITHUB_STEP_SUMMARY}"
