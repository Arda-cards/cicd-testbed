---
# PROBE — deliberately neutered to test whether a pull request can disable the
# gate that is supposed to be gating it. Must never merge.
name: changelog-check

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize, labeled, unlabeled]
  merge_group:

permissions: {}

jobs:
  changelog-check:
    runs-on: ubuntu-latest
    steps:
      - name: "Report success without checking anything"
        run: |
          echo "::warning::this gate was disabled by the pull request it is gating"
